<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="H.I.V.E Banner">
  <defs>
    <radialGradient id="borgGlow" cx="20%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#15803d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="hexGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 32 8 L 32 24 L 16 32 L 0 24 L 0 8 Z" fill="none" stroke="#14281a" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="20" fill="#050806"/>
  <rect width="1280" height="440" fill="url(#hexGrid)" rx="20"/>
  <rect width="1280" height="440" fill="url(#borgGlow)" rx="20"/>
  <rect width="1280" height="440" rx="20" fill="none" stroke="#1f4e2c" stroke-width="2"/>

  <!-- Left Side: Borg Cube & Neural Lattice Graphic -->
  <g transform="translate(110, 80)">
    <!-- Isometric Cybernetic Cube -->
    <g transform="translate(100, 140)">
      <!-- Top Face -->
      <polygon points="0,-70 80,-25 0,20 -80,-25" fill="#0d2315" stroke="#22c55e" stroke-width="2"/>
      <!-- Left Face -->
      <polygon points="-80,-25 0,20 0,110 -80,65" fill="#08170e" stroke="#22c55e" stroke-width="2"/>
      <!-- Right Face -->
      <polygon points="0,20 80,-25 80,65 0,110" fill="#050f09" stroke="#16a34a" stroke-width="2"/>
      
      <!-- Internal Conduit Grid Lines -->
      <line x1="-40" y1="-47" x2="40" y2="-2" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 3"/>
      <line x1="-40" y1="42" x2="0" y2="65" stroke="#4ade80" stroke-width="1.5"/>
      <line x1="0" y1="65" x2="40" y2="42" stroke="#4ade80" stroke-width="1.5"/>
      
      <!-- Core Pulsing Node -->
      <circle cx="0" cy="20" r="10" fill="#22c55e" filter="blur(2px)"/>
      <circle cx="0" cy="20" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right Side: Content -->
  <g transform="translate(440, 0)">
    <g transform="translate(0, 105)">
      <rect width="210" height="26" rx="13" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
      <text x="105" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="2">AUTONOMOUS AI AGENCY</text>
    </g>

    <g transform="translate(0, 190)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="url(#textGrad)">H.I.V.E.</text>
    </g>

    <g transform="translate(0, 240)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#f4f1f7">Borg Cube 3D Cybernetic Headquarters</text>
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#a8a2b2">12 persistent agents, NVIDIA NIM cascade routing, and immersive 3D command chamber in Unity.</text>
    </g>

    <g transform="translate(0, 318)">
      <rect width="130" height="34" rx="17" fill="#22c55e"/>
      <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#052e16" text-anchor="middle" letter-spacing="1">UNITY 3D</text>
      
      <rect x="145" width="160" height="34" rx="17" fill="#0d1f14" stroke="#1f4e2c" stroke-width="1.5"/>
      <text x="225" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="1">12 AI AGENTS</text>
      
      <rect x="320" width="160" height="34" rx="17" fill="#0d1f14" stroke="#1f4e2c" stroke-width="1.5"/>
      <text x="400" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="1">NVIDIA NIM ROUTING</text>
    </g>
  </g>
</svg>